<h2>Register</h2>

<div>

    <label>Name</label>
    <br>

    <input type="text" [(ngModel)]="name">

    <br><br>

    <label>Email</label>
    <br>

    <input type="email" [(ngModel)]="email">

    <br><br>

    <label>Password</label>
    <br>

    <input type="password" [(ngModel)]="password">

    <br><br>

    <button (click)="register()">Register</button>

</div>
