<h2>Login</h2>

<div>
    <label>Email</label>
    <br>

    <input type="email" [(ngModel)]="email">

    <br><br>

    <label>Password</label>
    <br>

    <input type="password" [(ngModel)]="password">

    <br><br>

    <button (click)="login()">login</button>

    <br><br>


    <a routerLink="/register">Don't have an account? Register</a>

</div>
